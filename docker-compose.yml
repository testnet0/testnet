services:
  db:
    image: ${OFFICIAL_REGISTRY:-}postgres:16-alpine
    container_name: testnet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-testnet}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
      POSTGRES_DB: testnet
    volumes:
      - testnet-db-data:/var/lib/postgresql/data
      - ./testnet-pg.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-testnet} -d testnet"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - testnet-backend

  redis:
    image: ${OFFICIAL_REGISTRY:-}redis:7-alpine
    container_name: testnet-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    volumes:
      - testnet-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - testnet-backend

  testnet-server:
    image: ${DOCKER_REGISTRY:-}testnet-server:${TESTNET_VERSION:-latest}
    container_name: testnet-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/testnet?stringtype=unspecified
      DB_USERNAME: ${DB_USERNAME:-testnet}
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      TESTNET_CLIENT_SECRET: ${TESTNET_CLIENT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-}
      TESTNET_LICENSE_FILE: ${TESTNET_LICENSE_FILE:-/app/.license/license.lic}
      TESTNET_LICENSE_PUBLIC_KEY: ${TESTNET_LICENSE_PUBLIC_KEY:-}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./testnet-server/uploads:/app/uploads
      - ./testnet-server/logs:/app/logs
      - ./license/server:/app/.license
      - /etc/machine-id:/etc/machine-id:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - testnet-backend
      - testnet-frontend

  testnet-web:
    image: ${DOCKER_REGISTRY:-}testnet-web:${TESTNET_VERSION:-latest}
    container_name: testnet-web
    restart: unless-stopped
    ports:
      - "3100:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      testnet-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - testnet-frontend

  testnet-client:
    image: ${DOCKER_REGISTRY:-}testnet-client:${TESTNET_VERSION:-latest}
    container_name: testnet-client
    restart: unless-stopped
    environment:
      TESTNET_SERVER_URL: http://testnet-server:8081
      TESTNET_CLIENT_SECRET: ${TESTNET_CLIENT_SECRET}
      TESTNET_NODE_NAME: ${TESTNET_NODE_NAME:-}
      TESTNET_DATA_DIR: /opt/testnet/client-data
      TESTNET_WORK_DIR: /opt/testnet/client-work
    volumes:
      # WARNING: Docker socket mount grants full control over the host Docker daemon.
      # This is required for containerized tool execution but presents a privilege escalation risk.
      # In production, consider using Docker-in-Docker (DinD) or rootless Docker alternatives.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./client-data:/opt/testnet/client-data
      - ./client-work:/opt/testnet/client-work
      - /tmp:/tmp
    depends_on:
      testnet-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - testnet-backend

volumes:
  testnet-db-data:
  testnet-redis-data:

networks:
  testnet-backend:
    internal: true
  testnet-frontend:
